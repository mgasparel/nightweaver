name: Windows build and test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      bead:
        description: Bead explicitly requiring hosted verification or CI investigation
        required: true
        type: string
      requirement:
        description: Specific dispatched requirement authorizing this run
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    name: Windows build and test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record verification identity
        shell: pwsh
        env:
          BEAD: ${{ inputs.bead }}
          REQUIREMENT: ${{ inputs.requirement }}
        run: |
          $revision = git rev-parse HEAD
          @"
          Event: $env:GITHUB_EVENT_NAME
          Bead: $env:BEAD
          Requirement: $env:REQUIREMENT
          Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          Tested revision: $revision
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Nightweaver.Web/Studio/package-lock.json
      - name: Install Beads 1.3.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'beads.zip'
          $install = Join-Path $env:RUNNER_TEMP 'beads'
          Invoke-WebRequest 'https://github.com/gastownhall/beads/releases/download/v1.3.1/beads_1.3.1_windows_amd64.zip' -OutFile $archive
          $expected = '48cd82e1d3e311c9bf9a5d6d67ad1a8542ae13d4e20c5bfb527656c5e666af76'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) { throw 'Beads archive checksum mismatch' }
          Expand-Archive $archive $install
          $executable = Get-ChildItem $install -Filter bd.exe -Recurse | Select-Object -First 1
          if ($null -eq $executable) { throw 'Beads executable missing from archive' }
          $executable.DirectoryName | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Dolt 2.1.5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'dolt.zip'
          $install = Join-Path $env:RUNNER_TEMP 'dolt'
          Invoke-WebRequest 'https://github.com/dolthub/dolt/releases/download/v2.1.5/dolt-windows-amd64.zip' -OutFile $archive
          $expected = 'c1c83a00f06393874929c94f69cd654fb8cb8ce9cda3e4c017de820eb7450862'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) { throw 'Dolt archive checksum mismatch' }
          Expand-Archive $archive $install
          $executable = Get-ChildItem $install -Filter dolt.exe -Recurse | Select-Object -First 1
          if ($null -eq $executable) { throw 'Dolt executable missing from archive' }
          $executable.DirectoryName | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure fixture Git identity
        shell: pwsh
        run: |
          git config --global user.name 'Nightweaver CI'
          git config --global user.email 'nightweaver-ci@users.noreply.github.com'
          git config --global core.longpaths true
      - name: Restore and build
        shell: pwsh
        run: |
          dotnet build Nightweaver.slnx -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Complete correctness suite (diagnostic timing)
        id: suite
        shell: pwsh
        run: |
          "fixture-temp=$([IO.Path]::GetTempPath().Replace('\', '/').TrimEnd('/'))" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $timer = [Diagnostics.Stopwatch]::StartNew()
          dotnet test --solution Nightweaver.slnx --minimum-expected-tests 995 --report-xunit-xml --report-xunit-xml-filename ci.xml --show-slowest-tests 20
          $testExit = $LASTEXITCODE
          $timer.Stop()
          Write-Host "Suite wall time including build, fixture publishing and teardown $($timer.Elapsed)"
          if ($testExit -ne 0) { exit $testExit }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: '**/TestResults/**'
          if-no-files-found: ignore
      - name: Upload retained native fixtures
        if: always() && steps.suite.outputs.fixture-temp != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-fixtures
          path: |
            ${{ steps.suite.outputs.fixture-temp }}/nightweaver-console-*/**
            ${{ steps.suite.outputs.fixture-temp }}/nightweaver-manual-delivery-*/**
          if-no-files-found: ignore
          include-hidden-files: true
