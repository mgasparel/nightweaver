</style></head><body data-variant="A"><a class="skip" href="#content">Skip to content</a><div id="app"></div><div id="toast" class="toast" role="status" aria-live="polite"></div><dialog id="detail" aria-labelledby="detail-title"></dialog><dialog id="search" aria-labelledby="search-title"></dialog><dialog id="add" aria-labelledby="add-title"></dialog>
<script>
const icons={home:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',floor:'<path d="M4 20V9l6 3V5l6 4V3h4v17Z"/>',brief:'<path d="M4 4h16v16H4zM8 8h8M8 12h8M8 16h5"/>',beads:'<path d="m12 3 9 9-9 9-9-9Z"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',arrow:'<path d="M4 12h15m-6-6 6 6-6 6"/>',merge:'<path d="M6 3v9a6 6 0 0 0 6 6h6M18 3v15m-4-4 4 4 4-4"/>',pause:'<path d="M8 5v14M16 5v14"/>',check:'<path d="m5 12 4 4L19 6"/>',moon:'<path d="M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11Z"/>'};
const ico=n=>`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[n]||icons.beads}</svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const projects=[{id:'nightshift',name:'Nightweaver',initial:'N',description:'The calm behind autonomous delivery.',merged:8,ready:5,paused:false},{id:'grove',name:'Grove',initial:'G',description:'A little more room for good ideas.',merged:3,ready:3,paused:false},{id:'orbit',name:'Orbit API',initial:'O',description:'A dependable foundation for what’s next.',merged:1,ready:4,paused:true}];
const tasks=[{id:'ns-241',project:'nightshift',title:'Make live execution easier to follow',stage:'Implement',agent:'Implementer',elapsed:'12m',progress:0,description:'Keep the important moments visible while agents work. Group related output, preserve scroll position, and make the current activity easy to find.'},{id:'gr-087',project:'grove',title:'Remember your place in a collection',stage:'Review',agent:'Reviewer',elapsed:'4m',progress:1,description:'Return readers to their last visited collection and reading position, even after a page refresh.'},{id:'ns-238',project:'nightshift',title:'Choose how archived projects appear',stage:'Needs you',agent:'Orchestrator',elapsed:'18m',progress:0,description:'Both approaches meet the technical requirements. A product decision will keep the implementation focused.',question:'Should archived projects stay in the sidebar?',decision:true},{id:'ns-232',project:'nightshift',title:'Keep catch-up summaries compact',stage:'Merged',agent:'Merger',elapsed:'32m ago',progress:3,description:'Milestones now stay compact until you choose to open the details.'},{id:'gr-081',project:'grove',title:'Add keyboard navigation to collections',stage:'Merged',agent:'Merger',elapsed:'1h ago',progress:3,description:'Navigate between collections without leaving the keyboard.'},{id:'or-042',project:'orbit',title:'Add request tracing to API responses',stage:'Ready',agent:'Unassigned',elapsed:'Queued',progress:0,description:'Include a stable trace identifier in API responses to make diagnostics easier.'},{id:'ns-245',project:'nightshift',title:'Keep project context in the Bead workspace',stage:'Ready',agent:'Unassigned',elapsed:'Queued',progress:0,description:'Always show the owning project when navigating directly to a Bead.'}];
const variants=['A','B','C'];let variant=new URLSearchParams(location.search).get('variant')||'A';if(!variants.includes(variant))variant='A';let scope='all',view='overview',filter='',status='all',detailId=null,tab='overview',caught=new Set(),lastFocus=null;
const selected=()=>projects.filter(p=>scope==='all'||p.id===scope);const visibleTasks=()=>tasks.filter(t=>scope==='all'||t.project===scope);const project=id=>projects.find(p=>p.id===id);const projectIcon=p=>`<span class="projecticon ${esc(p.id)}">${esc(p.initial)}</span>`;const label=s=>`<span class="pill ${s==='Needs you'?'warn':s==='Ready'?'neutral':''}">${s!=='Ready'?'<span class="dot"></span>':''}${esc(s)}</span>`;const active=()=>visibleTasks().filter(t=>['Implement','Review','QA','Merge'].includes(t.stage));const decisions=()=>visibleTasks().filter(t=>t.decision);
function scopeButtons(){return `<div class="scopebar" aria-label="Project filter"><button onclick="setScope('all')" class="${scope==='all'?'active':''}">All projects</button>${projects.map(p=>`<button onclick="setScope('${p.id}')" class="${scope===p.id?'active':''}">${esc(p.name)}</button>`).join('')}</div>`}
function nav(){return `<aside class="sidebar"><div class="brand"><span class="brandmark">${ico('moon')}</span><span class="brandname">nightweaver<span style="color:#b5ce95">.</span></span></div><nav aria-label="Workspace">${[['overview','home','Overview'],['floor','floor','Delivery floor'],['catchup','brief','Catch up'],['beads','beads','Beads']].map(([v,i,n])=>`<button class="navbtn ${view===v?'active':''}" onclick="setView('${v}')" title="${n}" ${view===v?'aria-current="page"':''}>${ico(i)}<span class="navlabel">${n}</span>${v==='overview'&&decisions().length?`<span class="count">${decisions().length}</span>`:''}</button>`).join('')}</nav><div class="eyebrow">Your projects</div><button class="projectbtn ${scope==='all'?'active':''}" onclick="setScope('all')">${ico('home')} All projects <span class="tiny"></span></button>${projects.map(p=>`<button class="projectbtn ${scope===p.id?'active':''}" onclick="setScope('${p.id}')">${projectIcon(p)}${esc(p.name)}${!p.paused?'<span class="tiny"></span>':''}</button>`).join('')}<button class="projectbtn addproject" onclick="openAdd()">＋ <span>Add project</span></button><div class="sidebottom"><div class="flex"><span class="dot" style="color:#b5ce95"></span><span class="small">Your local workspace</span></div><p class="sample">DESIGN PLAYGROUND<br>Sample data · changes reset on reload</p><div class="flex"><span class="avatar" style="color:#24382d">MG</span><div class="small">Personal workspace</div></div></div></aside>`}
function metrics(){let ps=selected(),running=ps.filter(p=>!p.paused).length;return `<div class="metrics"><div class="metric"><span class="eyebrow">Projects</span><strong>${ps.length}<span style="font-size:15px;color:var(--muted);letter-spacing:0"> / ${projects.length}</span></strong><span class="small muted">${running} running · ${ps.length-running} paused</span></div><div class="metric"><span class="eyebrow">In motion</span><strong>${active().length}</strong><span class="small muted">Across Delivery & review</span></div><div class="metric"><span class="eyebrow">Merged today</span><strong>${ps.reduce((n,p)=>n+p.merged,0)}</strong><span class="small" style="color:var(--accent)">Verified on the default branch</span><svg class="spark" viewBox="0 0 94 27" fill="none" aria-hidden="true"><path d="M0 25 13 21 24 23 37 12 48 17 61 8 72 12 94 1" stroke="currentColor" stroke-width="1.8"/></svg></div><div class="metric"><span class="eyebrow">Needs you</span><strong style="color:var(--amber)">${decisions().length}</strong><span class="small muted">${decisions().length?'A decision, then back to flow':'You’re clear to step away'}</span></div></div>`}
function bay(t,i){let paused=project(t.project).paused;return `<button class="card bay" onclick="openTask('${t.id}')" aria-label="Open ${esc(t.title)}"><div class="between"><span class="eyebrow">Delivery ${String(i+1).padStart(2,'0')}</span>${label(paused?'Paused':t.stage==='Implement'?'Building':t.stage==='Review'?'In review':t.stage)}</div><div class="meta mono muted">${esc(project(t.project).name)} <span style="margin:0 5px">/</span> ${t.id}</div><h3>${esc(t.title)}</h3><div class="agent">${ico('beads')} ${t.agent} <span style="float:right">${paused?'Paused':t.elapsed+' elapsed'}</span></div><div class="steps" aria-hidden="true">${[0,1,2,3].map(i=>`<span class="${i<t.progress?'done':i===t.progress?'current':''}"></span>`).join('')}</div><div class="between small muted stagecaption"><span>${t.stage} → ${['Review','QA','Merge','Done'][t.progress]}</span><span>Step ${t.progress+1} of 4</span></div><div class="between bayfooter"><span><span class="terminaldot">⌁</span> ${paused?'Waiting to resume':t.stage==='Implement'?'Updating the output view':'Checking acceptance criteria'}</span>${ico('arrow')}</div></button>`}
function floor(){return `<section class="floor-panel"><div class="between sectionhead"><h2>On the delivery floor</h2><span class="muted">${active().length} occupied bays</span></div><div class="floor-body">${active().length?`<div class="baygrid">${active().map(bay).join('')}</div>`:`<div class="empty"><h3>A quiet moment.</h3><p>${selected().every(p=>p.paused)?'This project is paused. Resume when you’re ready.':'No agents are working here right now. Ready Beads will be picked up when capacity is available.'}</p><button class="textbtn" onclick="setView('beads')">Explore ready Beads →</button></div>`}<div class="card merge"><div class="mergeicon">${ico('merge')}</div><div><h3 style="font-size:12px">Merge lane is clear</h3><p>One merge at a time, with a verified landing.</p></div><button class="textbtn" onclick="showMerged()">View merged →</button></div></div></section>`}
function attention(){let t=decisions()[0];return t?`<section class="card attention"><div class="panel-heading attention-heading"><h2>Needs your attention</h2><span class="small muted">${decisions().length} waiting</span></div><div class="attention-body"><div class="between"><span class="label">✦ A MOMENT FOR YOUR INPUT</span><span class="mono muted">${t.id}</span></div><h2 class="question">${esc(t.question)}</h2><p>${esc(project(t.project).name)} is waiting on a product choice. Other work is moving forward.</p><button class="btn primary" onclick="openTask('${t.id}')">Review decision ${ico('arrow')}</button><div class="small muted" style="margin-top:11px;font-size:10px">Paused safely · no work lost</div></div></section>`:`<section class="card attention"><div class="panel-heading attention-heading"><h2>Needs your attention</h2><span class="small muted">${decisions().length} waiting</span></div><div class="attention-body"><span class="label">✓ YOU’RE ALL CLEAR</span><h2 class="question">Nothing needs your attention.</h2><p>Your projects have what they need. A good moment to step away.</p></div></section>`}
function digest(full=false){let done=visibleTasks().filter(t=>t.stage==='Merged'),isRead=caught.has(scope);return `<section class="card digest"><div class="between digest-heading"><h2>${full?'Your catch-up brief':'While you were away'}</h2>${!full?'<span class="eyebrow">Since 9:00 AM</span>':''}</div><div class="digest-body"><p class="lead">${isRead?'You’re caught up. Here’s what you’ve already seen.':`${selected().reduce((n,p)=>n+p.merged,0)} changes landed. ${decisions().length?'One decision is waiting.':'No decisions are waiting.'}`}</p>${full?'<p style="margin-bottom:22px;font-size:14px">The work kept moving. Here are the outcomes that matter, with the evidence one click away.</p>':''}${done.map(t=>`<div class="event"><span class="eventicon">✓</span><div><button class="rowtitle" onclick="openTask('${t.id}')" style="font-size:${full?'15':'12'}px">${esc(t.title)}</button><small>${esc(project(t.project).name)} · merged ${t.elapsed}</small>${full?`<p class="muted" style="margin-top:7px">${esc(t.description)}</p>`:''}</div></div>`).join('')}${!done.length?'<div class="event"><span class="eventicon">·</span><div><p>No merges in this window.</p><small>New milestones will appear here.</small></div></div>':''}${full?`<div class="event"><span class="eventicon">↗</span><div><p>${active().length} Beads are moving through Delivery</p><small>Open the Delivery floor for current activity.</small></div></div><button class="btn ${isRead?'':'primary'}" style="margin-top:20px" onclick="markRead()" ${isRead?'disabled':''}>${isRead?'✓ You’re caught up':'Mark as caught up'}</button>`:`<button class="textbtn" style="margin-top:12px" onclick="setView('catchup')">Read your brief ${ico('arrow')}</button>`}</div></section>`}
function projectCards(){return `<section class="projectsection"><div class="between sectionhead"><h2>Your projects</h2><button class="textbtn" onclick="openAdd()">＋ Add project</button></div><div class="projectgrid">${selected().map(p=>`<button class="card projectcard" onclick="setScope('${p.id}')"><div class="between"><div class="flex">${projectIcon(p)}<h3>${esc(p.name)}</h3></div>${label(p.paused?'Paused':'Running')}</div><p class="description">${esc(p.description)}</p><div class="summary"><span>${p.merged} merged today</span><span>${p.ready} ready ${ico('arrow')}</span></div></button>`).join('')}</div></section>`}
function beadTable(){let ts=visibleTasks().filter(t=>(status==='all'||t.stage===status)&&(!filter||`${t.id} ${t.title} ${project(t.project).name}`.toLowerCase().includes(filter.toLowerCase())));return `<div class="controls"><input class="field" aria-label="Filter Beads" placeholder="Filter by title, ID, or project…" value="${esc(filter)}" oninput="filter=this.value;renderTable()"><select class="field" aria-label="Bead status" onchange="status=this.value;renderTable()">${['all','Ready','Implement','Review','Needs you','Merged'].map(s=>`<option value="${s}" ${status===s?'selected':''}>${s==='all'?'All statuses':s}</option>`).join('')}</select><span class="small muted" id="row-count">${ts.length} Beads</span></div><div id="table-content">${tableRows(ts)}</div>`}
function tableRows(ts){return ts.length?`<div class="tablebox"><table><thead><tr><th>Bead</th><th>Project</th><th>Status</th><th>Updated</th></tr></thead><tbody>${ts.map(t=>`<tr><td><span class="mono muted">${t.id}</span><br><button class="rowtitle" onclick="openTask('${t.id}')">${esc(t.title)}</button></td><td>${esc(project(t.project).name)}</td><td>${label(t.stage)}</td><td class="muted">${t.elapsed}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><h3>No Beads match.</h3><p>Try a shorter search or a different status.</p><button class="textbtn" onclick="filter=\'\';status=\'all\';render()">Clear filters</button></div>'}
function renderTable(){const ts=visibleTasks().filter(t=>(status==='all'||t.stage===status)&&`${t.id} ${t.title} ${project(t.project).name}`.toLowerCase().includes(filter.toLowerCase()));document.getElementById('table-content').innerHTML=tableRows(ts);document.getElementById('row-count').textContent=ts.length+' Beads'}
function studioOverview(){return `<div class="studio-overview">${floor()}${attention()}${projectCards()}${digest()}</div>`}
function render(){document.body.dataset.variant=variant;const title=view==='catchup'?'Welcome back.':view==='floor'?'Good work, in motion.':view==='beads'?'Every Bead, in context.':scope==='all'?'A little oversight. A lot of progress.':`${project(scope).name}, at a glance.`;document.getElementById('app').innerHTML=`<div class="app ${variant}">${nav()}<div class="main"><header class="topbar"><div class="crumb">${variant==='B'?'nightweaver.':'Workspace'}<span>/</span><strong>${scope==='all'?'All projects':esc(project(scope).name)}</strong></div><div class="flex" style="gap:24px"><select class="field viewselect" aria-label="View" onchange="setView(this.value)">${[['overview','Overview'],['floor','Delivery floor'],['catchup','Catch up'],['beads','Beads']].map(([v,n])=>`<option value="${v}" ${view===v?'selected':''}>${n}</option>`).join('')}</select><button class="searchbtn" onclick="openSearch()" aria-label="Search workspace">${ico('search')}<span>Search</span><kbd class="key">Ctrl K</kbd></button><span class="pill live"><span class="dot"></span> Sample workspace</span><span class="avatar">MG</span></div></header><main class="canvas" id="content">${scopeButtons()}<div class="between heading"><div><div class="date">SATURDAY, NOVEMBER 14 <span style="padding:0 7px">·</span> DESIGN PREVIEW</div><h1>${title}</h1><p>${view==='overview'?'Your agents have the details. You have the bigger picture.':view==='catchup'?'The meaningful changes, without the wall of activity.':view==='floor'?'Parallel Delivery. Independent review. One careful merge at a time.':'Manually planned by you. Carried through Delivery by Nightweaver.'}</p></div><div class="flex">${view==='overview'?`<button class="btn" onclick="setView('catchup')">${ico('brief')} Catch me up</button>`:view==='catchup'?`<button class="btn" onclick="setView('overview')">Back to overview</button>`:''}${scope!=='all'?`<button class="btn" onclick="togglePause()">${ico('pause')} ${project(scope).paused?'Resume project':'Pause project'}</button>`:''}</div></div>${variant==='B'&&view==='overview'?'<p class="briefintro">A workspace that gives you your time back.<br>Here’s what changed, and where you can help.</p>':''}${scope!=='all'&&project(scope).paused?'<div class="pausehint">Ⅱ This project is paused. In this preview, agent activity is held until you resume.</div>':''}${view==='overview'?`${metrics()}${variant==='A'?studioOverview():`${variant==='C'?projectCards():''}<div class="grid"><div class="stack">${floor()}</div><div class="stack">${attention()}${digest()}</div></div>${variant!=='C'?projectCards():''}`}`:view==='floor'?`${metrics()}${floor()}`:view==='catchup'?`<div class="grid"><div>${digest(true)}</div><div class="stack" style="align-content:start">${attention()}<section class="card digest"><h2>A brief that respects your time.</h2><p class="lead">Merged work becomes milestones. Repeated repair attempts stay inside their Bead. Decisions that need you stay visible until resolved.</p><span class="pill neutral">Since your last visit · 9:00 AM</span></section></div></div>`:`<div class="between"><h2>Project Beads</h2><span class="small muted">${scope==='all'?'Across your workspace':esc(project(scope).name)}</span></div>${beadTable()}`}</main></div><div class="switcher" aria-label="Prototype visual direction"><span class="switchlabel">Explore a direction</span><button class="arrow" aria-label="Previous direction" onclick="cycle(-1)">‹</button>${[['A','01 · Studio'],['B','02 · Fieldnotes'],['C','03 · Control']].map(([v,n])=>`<button class="${variant===v?'selected':''}" aria-pressed="${variant===v}" onclick="setVariant('${v}')">${n}</button>`).join('')}<button class="arrow" aria-label="Next direction" onclick="cycle(1)">›</button></div></div>`}
function setScope(s){scope=s;filter='';status='all';render()}function setView(v){view=v;render();window.scrollTo(0,0)}function setVariant(v){variant=v;const url=new URL(location.href);url.searchParams.set('variant',v);history.replaceState(null,'',url);render();const b=document.querySelector('.switcher .selected');b.focus()}function cycle(d){setVariant(variants[(variants.indexOf(variant)+d+3)%3])}function showMerged(){status='Merged';view='beads';render()}function markRead(){caught.add(scope);render();toast('You’re caught up. Enjoy the breathing room.')}function togglePause(){project(scope).paused=!project(scope).paused;render();toast(project(scope).paused?'Project paused in this preview.':'Project resumed in this preview.')}let toastTimer;function toast(s){clearTimeout(toastTimer);document.getElementById('toast').textContent=s;toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',4500)}
function openDialog(id){lastFocus=document.activeElement;document.getElementById(id).showModal()}function closeDialog(id){document.getElementById(id).close();if(lastFocus?.isConnected)lastFocus.focus()}
function openTask(id){detailId=id;tab='overview';renderDetail();openDialog('detail')}
function renderDetail(){let t=tasks.find(t=>t.id===detailId),p=project(t.project);document.getElementById('detail').innerHTML=`<div class="dialogheader between"><div class="flex">${projectIcon(p)}<span class="small">${esc(p.name)} <span class="muted"> / Bead workspace / </span><span class="mono">${t.id}</span></span></div><button class="close" aria-label="Close Bead workspace" onclick="closeDialog('detail')">×</button></div><div class="dialogbody"><div class="between">${label(t.stage)}<span class="small muted">${esc(t.agent)} · ${t.elapsed}</span></div><h2 id="detail-title">${esc(t.title)}</h2><p>${esc(t.description)}</p><div class="tabs" role="tablist" aria-label="Bead details">${['overview','activity','output'].map(v=>`<button role="tab" tabindex="${tab===v?0:-1}" id="tab-${v}" aria-controls="bead-panel" aria-selected="${tab===v}" class="${tab===v?'active':''}" onclick="tab='${v}';renderDetail();document.getElementById('tab-${v}').focus()">${v==='output'?'Agent output':v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div><div class="tabbody" id="bead-panel" role="tabpanel" aria-labelledby="tab-${tab}" tabindex="0">${tab==='overview'?`<div class="eyebrow">What success looks like</div><ul class="checks"><li>The owning project is always visible.</li><li>The primary action is reachable using the keyboard.</li><li>Review and QA verify the acceptance criteria before merge.</li></ul><details><summary class="small" style="cursor:pointer;padding:10px 0">Environment & delivery context</summary><p style="margin-top:10px" class="mono">Project: ${esc(p.name)}<br>Branch: work/${t.id}<br>Target: main<br>Delivery stage: ${esc(t.stage)}<br>Fixture: sample data, no runtime connected</p></details>`:tab==='activity'?`<div class="event"><span class="eventicon">✓</span><div><p>You planned this Bead</p><small>Today · 9:12 AM</small></div></div><div class="event"><span class="eventicon">↗</span><div><p>Orchestrator picked up the ready work</p><small>Today · 9:14 AM</small></div></div><details style="padding:16px 0"><summary class="small">Earlier agent history · 3 entries</summary><p style="margin-top:12px">Implementer inspected the existing behavior.<br>Acceptance criteria were checked against the plan.<br>A focused change was prepared for review.</p></details><div class="event"><span class="eventicon">${t.decision?'!':'·'}</span><div><p>${t.decision?'Paused safely for your product decision':t.stage==='Merged'?'Merge verified on main':esc(t.agent)+' is working on this Bead'}</p><small>Latest update · sample history</small></div></div>`:`<div class="between" style="margin-bottom:12px"><span class="pill neutral">Sample output</span><span class="small muted">${t.stage==='Merged'?'Invocation completed':'Snapshot · no live connection'}</span></div><pre class="code">09:14:02  Loaded ${t.id} in ${esc(p.name)}
09:14:03  Read the plan and acceptance criteria
09:14:09  Inspected the existing implementation

function resolveDecision(e){e.preventDefault();let t=tasks.find(t=>t.id===detailId);t.decision=false;t.stage='Ready';t.agent='Orchestrator';t.elapsed='Just now';closeDialog('detail');render();toast('Guidance sent. The Bead is ready to resume in this preview.')}
function openSearch(){document.getElementById('search').innerHTML=`<div class="dialogheader between"><h2 id="search-title">Find your way</h2><button class="close" aria-label="Close search" onclick="closeDialog('search')">×</button></div><div class="dialogbody"><input class="field" id="global-search" style="width:100%" placeholder="Search projects or Beads…" aria-label="Search projects or Beads" oninput="searchResults(this.value)"><div class="searchresults" id="search-results"></div></div><div class="dialogfooter">Across all projects · Escape to close</div>`;searchResults('');openDialog('search');document.getElementById('global-search').focus()}
function searchResults(q){q=q.toLowerCase();let ps=projects.filter(p=>p.name.toLowerCase().includes(q)),ts=tasks.filter(t=>(t.title+' '+t.id+' '+project(t.project).name).toLowerCase().includes(q));document.getElementById('search-results').innerHTML=ps.map(p=>`<button class="result" onclick="closeDialog('search');setScope('${p.id}')"><span class="flex">${projectIcon(p)} ${esc(p.name)}</span><span class="small muted">Project →</span></button>`).join('')+ts.map(t=>`<button class="result" onclick="closeDialog('search');openTask('${t.id}')"><span><span class="mono muted">${t.id} · ${esc(project(t.project).name)}</span><br>${esc(t.title)}</span>${ico('arrow')}</button>`).join('')||'<p class="muted" style="padding:20px">No matches. Try a project name or Bead ID.</p>'}
function openAdd(){document.getElementById('add').innerHTML=`<div class="dialogheader between"><h2 id="add-title">Room for another project.</h2><button class="close" aria-label="Close add project" onclick="closeDialog('add')">×</button></div><form class="dialogbody" onsubmit="addProject(event)"><p>Try your workspace with another project. This preview creates a sample project in memory.</p><label for="project-name" style="display:block;margin:22px 0 9px">Project name</label><input class="field" id="project-name" required maxlength="40" placeholder="Your next good idea" style="width:100%"><p class="small muted" style="margin:14px 0 23px">New projects start paused, with an empty Delivery floor. Connecting a repository and Beads database belongs in the real setup flow.</p><button class="btn primary">Create sample project ${ico('arrow')}</button></form>`;openDialog('add')}
function addProject(e){e.preventDefault();const name=document.getElementById('project-name').value.trim();if(!name)return;const id='sample'+projects.length;projects.push({id,name,initial:name[0].toUpperCase(),description:'Your next chapter starts here.',merged:0,ready:0,paused:true});closeDialog('add');view='overview';setScope(id);toast('Sample project added. Start with an empty workspace.')}
document.addEventListener('keydown',e=>{if(e.target.matches('[role=tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=['overview','activity','output'];tab=e.key==='Home'?tabs[0]:e.key==='End'?tabs[2]:tabs[(tabs.indexOf(tab)+(e.key==='ArrowRight'?1:2))%3];renderDetail();document.getElementById('tab-'+tab).focus();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!document.querySelector('dialog[open]'))openSearch();return}if(document.querySelector('dialog[open]')||e.target.closest('input,textarea,select,[contenteditable=true]'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1)}});document.querySelectorAll('dialog').forEach(d=>{d.addEventListener('cancel',()=>{if(lastFocus?.isConnected)setTimeout(()=>lastFocus.focus(),0)});d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog(d.id)}})});window.addEventListener('popstate',()=>{variant=new URLSearchParams(location.search).get('variant')||'A';if(!variants.includes(variant))variant='A';render()});render();
